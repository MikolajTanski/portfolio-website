  </defs>

  <rect width="920" height="520" rx="16" fill="url(#bg)"/>
  <text x="460" y="36" text-anchor="middle" fill="#e5fef4" font-family="Arial, sans-serif" font-size="18" font-weight="600">Przeplyw danych - od wejscia na strone do pobrania CV</text>

  <rect x="40" y="60" width="160" height="70" rx="8" fill="#14532d" stroke="#00ff88" stroke-width="1.5"/>
