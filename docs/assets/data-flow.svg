  <text x="140" y="378" text-anchor="middle" fill="#6b7280" font-family="Arial, sans-serif" font-size="10">Kotwice w Navbar</text>
  <text x="140" y="396" text-anchor="middle" fill="#6b7280" font-family="Arial, sans-serif" font-size="10">Animacje scroll</text>

  <rect x="280" y="330" width="200" height="80" rx="8" fill="#0a1f14" stroke="#374151" stroke-width="1.5"/>
