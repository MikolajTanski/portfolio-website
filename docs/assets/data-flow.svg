  <text x="570" y="108" text-anchor="middle" fill="#9ca3af" font-family="Arial, sans-serif" font-size="10">PL lub EN z localStorage</text>

  <path d="M670 95 H710" stroke="#00ff88" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="720" y="60" width="160" height="70" rx="8" fill="#0a1f14" stroke="#00ff88" stroke-width="1.5"/>
