  <text x="120" y="108" text-anchor="middle" fill="#9ca3af" font-family="Arial, sans-serif" font-size="10">Odwiedzajacy otwiera URL</text>

  <path d="M210 95 H250" stroke="#00ff88" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="260" y="60" width="160" height="70" rx="8" fill="#0a1f14" stroke="#00ff88" stroke-width="1.5"/>
