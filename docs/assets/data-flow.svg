  <text x="380" y="378" text-anchor="middle" fill="#6b7280" font-family="Arial, sans-serif" font-size="10">PL / EN toggle</text>
  <text x="380" y="396" text-anchor="middle" fill="#6b7280" font-family="Arial, sans-serif" font-size="10">Meta tagi SEO aktualizowane</text>

  <rect x="520" y="330" width="200" height="80" rx="8" fill="#0a1f14" stroke="#374151" stroke-width="1.5"/>
  <text x="620" y="358" text-anchor="middle" fill="#9ca3af" font-family="Arial, sans-serif" font-size="12" font-weight="600">Linki zewnetrzne</text>
  <text x="620" y="378" text-anchor="middle" fill="#6b7280" font-family="Arial, sans-serif" font-size="10">GitHub, certyfikaty</text>
  <text x="620" y="396" text-anchor="middle" fill="#6b7280" font-family="Arial, sans-serif" font-size="10">Email, tel (dev only)</text>

  <rect x="700" y="330" width="180" height="80" rx="8" fill="#14532d" stroke="#00ff88" stroke-width="2"/>
  <text x="790" y="358" text-anchor="middle" fill="#00ff88" font-family="Arial, sans-serif" font-size="12" font-weight="600">Pobierz CV</text>
  <text x="790" y="378" text-anchor="middle" fill="#9ca3af" font-family="Arial, sans-serif" font-size="10">pdfmake w przegladarce</text>
  <text x="790" y="396" text-anchor="middle" fill="#6b7280" font-family="Arial, sans-serif" font-size="10">Bez wysylki na serwer</text>

  <path d="M790 410 V440" stroke="#00ff88" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="560" y="450" width="300" height="50" rx="8" fill="#0a1f14" stroke="#00a060" stroke-width="1.5"/>
  <text x="710" y="480" text-anchor="middle" fill="#e5fef4" font-family="Arial, sans-serif" font-size="11">messages + cv-photo.png to PDF lokalnie</text>

  <text x="460" y="510" text-anchor="middle" fill="#6b7280" font-family="Arial, sans-serif" font-size="10">Dane nie opuszczaja przegladarki (poza statycznymi plikami z CDN)</text>
