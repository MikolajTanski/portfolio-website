  <text x="460" y="248" text-anchor="middle" fill="#6b7280" font-family="Arial, sans-serif" font-size="10">+ projectMeta (linki GitHub, tagi technologii)</text>
  <text x="460" y="272" text-anchor="middle" fill="#6b7280" font-family="Arial, sans-serif" font-size="10">Zmiana tresci w jednym pliku aktualizuje strone i CV</text>

