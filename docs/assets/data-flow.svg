  <text x="340" y="108" text-anchor="middle" fill="#9ca3af" font-family="Arial, sans-serif" font-size="10">Vite bundle z CDN</text>

  <path d="M430 95 H470" stroke="#00ff88" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="480" y="60" width="180" height="70" rx="8" fill="#0a1f14" stroke="#00c878" stroke-width="1.5"/>
